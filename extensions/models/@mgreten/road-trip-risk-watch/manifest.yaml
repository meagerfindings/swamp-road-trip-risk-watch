manifestVersion: 1
name: "@mgreten/road-trip-risk-watch"
version: "2026.07.16.1"
description: >
  Native route-risk watcher that polls official NWS forecast and alert data for
  checkpointed trips, computes a stable fingerprint, and emits digest output
  only when conditions change materially. Intended to run on a recurring
  schedule (e.g. every few minutes) via your own automation. If a companion
  origin snapshot file is present at liveOriginStatePath, it resolves the first
  checkpoint from that live geocoded location on each run.
repository: https://github.com/meagerfindings/swamp-road-trip-risk-watch

paths:
  base: manifest

additionalFiles:
  - README.md
  - LICENSE.md

models:
  - model.ts

platforms:
  - linux-x86_64
  - darwin-aarch64
